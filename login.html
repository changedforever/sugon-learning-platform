<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 光合技术支持平台</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary-red: #b60007;
      --primary-red-deep: #7f0004;
      --primary-red-light: #ff3636;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --panel-border: rgba(255, 255, 255, 0.5);
      --text-main: #3b3b3b;
      --text-sub: #8a8a8a;
      --input-bg: #eef3fb;
      --shadow-strong: 0 28px 60px rgba(70, 0, 0, 0.28);
      --shadow-soft: 0 18px 50px rgba(120, 0, 0, 0.24);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 24% 42%, rgba(255, 255, 255, 0.24) 0, rgba(255, 255, 255, 0.06) 11%, rgba(255, 255, 255, 0) 22%),
        radial-gradient(circle at 74% 75%, rgba(255, 106, 106, 0.28) 0, rgba(255, 106, 106, 0) 16%),
        radial-gradient(circle at 15% 90%, rgba(255, 163, 163, 0.18) 0, rgba(255, 163, 163, 0) 10%),
        linear-gradient(135deg, #850004 0%, #b30007 34%, #d60209 64%, #ac0006 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at 18% 28%, rgba(255, 255, 255, 0.14) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 62%, rgba(255, 255, 255, 0.16) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 70%, rgba(255, 214, 214, 0.2) 0 3px, transparent 4px),
        radial-gradient(circle at 92% 55%, rgba(255, 255, 255, 0.12) 0 2px, transparent 3px);
      background-size: 320px 220px, 500px 300px, 420px 260px, 360px 280px;
      opacity: 0.85;
    }

    body::after {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 180, 180, 0.12) 100%),
        radial-gradient(ellipse at bottom left, rgba(255, 255, 255, 0.22) 0, rgba(255, 255, 255, 0) 42%);
      mix-blend-mode: screen;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 28px 34px 40px;
      overflow: hidden;
      isolation: isolate;
    }

    .brand {
      position: relative;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    .brand-mark img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      opacity: 0.95;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.1;
    }

    .brand-copy strong {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-copy span {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 600;
    }

    .scene {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      padding: 24px 2vw 0;
    }

    .hero {
      position: relative;
      flex: 1;
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto auto 82px 14px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.9) 0 16%, rgba(255, 233, 233, 0.92) 17%, rgba(255, 255, 255, 0.3) 28%, rgba(255, 255, 255, 0) 56%),
        url("images/gq_icon2.png") center/contain no-repeat;
      opacity: 0.96;
      filter: drop-shadow(0 0 50px rgba(255, 214, 214, 0.55));
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 38px;
      bottom: 90px;
      width: 470px;
      height: 470px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.52) 0 24%, rgba(255, 255, 255, 0.16) 25%, rgba(255, 255, 255, 0.02) 52%, rgba(255, 255, 255, 0) 72%),
        url("images/gq_icon.png") center/contain no-repeat;
      filter: blur(0.2px) drop-shadow(0 0 28px rgba(255, 40, 40, 0.6));
      opacity: 0.92;
      transform: rotate(-8deg);
    }

    .orbit-core {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.86) 0, rgba(255, 235, 235, 0.75) 34%, rgba(255, 189, 208, 0.96) 62%, rgba(255, 138, 167, 0.9) 100%);
      box-shadow:
        0 0 0 18px rgba(255, 255, 255, 0.1),
        0 0 0 34px rgba(255, 255, 255, 0.06),
        0 26px 70px rgba(95, 0, 0, 0.38);
      z-index: 2;
    }

    .orbit-core::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 32px;
      background:
        linear-gradient(145deg, rgba(255, 204, 222, 0.88), rgba(255, 151, 186, 0.94)),
        linear-gradient(135deg, #ffeff4, #ff85af);
      clip-path: polygon(18% 0, 82% 0, 100% 18%, 100% 82%, 82% 100%, 18% 100%, 0 82%, 0 18%);
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.22),
        0 0 40px rgba(255, 164, 195, 0.55);
    }

    .robot {
      position: relative;
      width: 128px;
      height: 98px;
      border-radius: 44px;
      background: linear-gradient(145deg, #111 0%, #292929 100%);
      border: 8px solid rgba(234, 246, 255, 0.85);
      box-shadow:
        0 16px 30px rgba(84, 0, 0, 0.3),
        inset 0 0 24px rgba(255, 255, 255, 0.08);
      z-index: 1;
      transform: translateY(-4px);
    }

    .robot::before,
    .robot::after {
      content: "";
      position: absolute;
      top: 34px;
      width: 14px;
      height: 30px;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffd7ea, #ffb2d1);
      box-shadow: 0 0 16px rgba(255, 198, 226, 0.55);
    }

    .robot::before {
      left: 32px;
    }

    .robot::after {
      right: 32px;
    }

    .robot-ring {
      position: absolute;
      width: 186px;
      height: 186px;
      border-radius: 50%;
      border: 18px solid rgba(154, 245, 255, 0.14);
      box-shadow:
        inset 0 0 0 8px rgba(255, 255, 255, 0.08),
        0 0 30px rgba(153, 255, 244, 0.25);
      z-index: 0;
    }

    .robot-ring::before,
    .robot-ring::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 7px solid transparent;
    }

    .robot-ring::before {
      inset: -18px;
      border-top-color: rgba(255, 255, 255, 0.45);
      border-left-color: rgba(255, 255, 255, 0.25);
      transform: rotate(24deg);
    }

    .robot-ring::after {
      inset: 14px;
      border-right-color: rgba(255, 185, 225, 0.5);
      border-bottom-color: rgba(255, 185, 225, 0.25);
      transform: rotate(-18deg);
    }

    .card-wrap {
      width: min(100%, 370px);
      padding-right: 3vw;
      display: flex;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: var(--shadow-strong);
      padding: 30px 28px 24px;
      color: var(--text-main);
      position: relative;
      z-index: 4;
    }

    .login-card h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: #464646;
      letter-spacing: 0.01em;
    }

    .login-card .subtitle {
      margin: 8px 0 22px;
      font-size: 12px;
      color: #8e8e8e;
    }

    .mode-tabs {
      display: inline-flex;
      width: 100%;
      padding: 4px;
      border-radius: 999px;
      background: #f2f2f2;
      margin-bottom: 18px;
      gap: 4px;
    }

    .mode-tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: #707070;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: #ffffff;
      color: #d10b11;
      box-shadow: 0 10px 20px rgba(193, 20, 20, 0.08);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .field {
      position: relative;
      margin-bottom: 14px;
    }

    .field input {
      width: 100%;
      height: 44px;
      border: 1px solid #e7edf7;
      border-radius: 4px;
      background: var(--input-bg);
      padding: 0 42px 0 13px;
      font-size: 12px;
      color: #424242;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .field input:focus {
      border-color: rgba(220, 18, 27, 0.6);
      background: #f7faff;
      box-shadow: 0 0 0 3px rgba(224, 30, 39, 0.08);
    }

    .field input::placeholder {
      color: #afb8c6;
    }

    .field .field-action {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: #aeb5c1;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }

    .inline-row {
      display: grid;
      grid-template-columns: 1fr 86px;
      gap: 8px;
      margin-bottom: 14px;
    }

    .captcha-box,
    .send-code-btn {
      height: 44px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #fff;
    }

    .captcha-box {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .captcha-box canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .send-code-btn {
      border: 0;
      background: linear-gradient(135deg, #ff5555, #d6080f);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(207, 17, 27, 0.2);
    }

    .send-code-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      box-shadow: none;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 16px;
      font-size: 12px;
      color: #8c8c8c;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      margin: 0;
      accent-color: #d50910;
    }

    .forgot-link,
    .register-link {
      text-decoration: none;
      color: #9a9a9a;
    }

    .forgot-link:hover,
    .register-link:hover {
      color: #d50910;
    }

    .primary-btn {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 4px;
      background: linear-gradient(180deg, #ff1717 0%, #ea0008 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(228, 0, 8, 0.28);
    }

    .primary-btn:hover {
      filter: brightness(1.04);
    }

    .signup-bar {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      font-size: 12px;
      color: #a6a6a6;
      gap: 4px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 14px;
      color: #a6a6a6;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ececec;
    }

    .alt-login {
      display: flex;
      gap: 10px;
    }

    .alt-login button,
    .alt-login a {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #eee;
      background: #fff;
      color: #535353;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 24px rgba(60, 60, 60, 0.04);
    }

    .alt-login button:hover,
    .alt-login a:hover {
      transform: translateY(-1px);
      border-color: #f4b9bb;
      box-shadow: 0 12px 28px rgba(216, 15, 24, 0.1);
    }

    .alt-login img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .qr-panel {
      padding-top: 6px;
    }

    .qr-card {
      background: linear-gradient(180deg, #fff 0%, #fff7f7 100%);
      border: 1px solid #f4d7d7;
      border-radius: 14px;
      padding: 18px 16px 14px;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }

    .qr-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #d40a12;
      font-size: 14px;
      font-weight: 800;
    }

    .qr-canvas-wrap {
      width: 174px;
      height: 174px;
      margin: 0 auto 12px;
      padding: 12px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 18px 30px rgba(200, 0, 10, 0.14);
    }

    .qr-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      background: #fff;
    }

    .qr-card p {
      margin: 0;
      color: #777;
      line-height: 1.7;
      font-size: 12px;
    }

    .qr-status {
      margin-top: 10px;
      color: #d20d14;
      font-size: 12px;
      font-weight: 700;
    }

    .switch-back {
      margin-top: 12px;
      border: 0;
      background: transparent;
      color: #d20d14;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .floating-balls span,
    .right-balls span {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #ff5454 58%, #da0d14 100%);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.2);
      opacity: 0.95;
    }

    .floating-balls span:nth-child(1) {
      width: 24px;
      height: 24px;
      left: 14px;
      bottom: 145px;
    }

    .floating-balls span:nth-child(2) {
      width: 12px;
      height: 12px;
      left: 160px;
      bottom: 110px;
    }

    .floating-balls span:nth-child(3) {
      width: 18px;
      height: 18px;
      left: 540px;
      bottom: 120px;
    }

    .floating-balls span:nth-child(4) {
      width: 10px;
      height: 10px;
      left: 566px;
      bottom: 248px;
      background: radial-gradient(circle at 30% 30%, #fff, #ffc3c3 55%, #ff3e3e 100%);
    }

    .right-balls span:nth-child(1) {
      width: 16px;
      height: 16px;
      right: 74px;
      top: 300px;
    }

    .right-balls span:nth-child(2) {
      width: 28px;
      height: 28px;
      right: 46px;
      bottom: 120px;
    }

    .right-balls span:nth-child(3) {
      width: 10px;
      height: 10px;
      right: 190px;
      bottom: 170px;
    }

    .wave-group {
      position: absolute;
      left: -12%;
      right: -6%;
      bottom: -28px;
      height: 240px;
      z-index: 1;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      left: 0;
      right: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.16);
      transform: rotate(-6deg);
    }

    .wave.wave-1 {
      bottom: -84px;
      height: 168px;
      border-width: 5px;
      opacity: 0.9;
    }

    .wave.wave-2 {
      bottom: -35px;
      left: -4%;
      right: -1%;
      height: 136px;
      opacity: 0.58;
    }

    .wave.wave-3 {
      bottom: 12px;
      left: -10%;
      right: 16%;
      height: 110px;
      opacity: 0.3;
    }

    .wave-glow {
      position: absolute;
      left: -3%;
      right: -3%;
      bottom: 26px;
      height: 110px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, rgba(255, 255, 255, 0.4) 0, rgba(255, 255, 255, 0.18) 24%, rgba(255, 255, 255, 0) 68%);
      filter: blur(12px);
      opacity: 0.82;
    }

    @media (max-width: 1100px) {
      .scene {
        gap: 26px;
        padding-top: 10px;
      }

      .hero {
        min-height: 520px;
      }

      .hero::before {
        width: 430px;
        height: 430px;
      }

      .hero::after {
        width: 392px;
        height: 392px;
        left: 44px;
      }

      .floating-balls span:nth-child(3),
      .floating-balls span:nth-child(4) {
        display: none;
      }
    }

    @media (max-width: 920px) {
      .page {
        padding: 20px 16px 30px;
      }

      .scene {
        min-height: auto;
        flex-direction: column;
        justify-content: flex-start;
        padding: 18px 0 0;
      }

      .hero {
        min-height: 360px;
        width: 100%;
      }

      .hero::before {
        width: 320px;
        height: 320px;
        left: 50%;
        bottom: 36px;
        transform: translateX(-50%);
      }

      .hero::after {
        width: 286px;
        height: 286px;
        left: 50%;
        bottom: 54px;
        transform: translateX(-50%) rotate(-8deg);
      }

      .orbit-core {
        width: 186px;
        height: 186px;
      }

      .robot {
        width: 102px;
        height: 80px;
      }

      .robot::before,
      .robot::after {
        top: 25px;
        width: 11px;
        height: 24px;
      }

      .robot::before {
        left: 24px;
      }

      .robot::after {
        right: 24px;
      }

      .robot-ring {
        width: 150px;
        height: 150px;
      }

      .card-wrap {
        width: 100%;
        padding-right: 0;
      }

      .login-card {
        max-width: 420px;
      }

      .wave-group {
        bottom: -50px;
        height: 180px;
      }
    }

    @media (max-width: 520px) {
      .brand-copy strong {
        font-size: 15px;
      }

      .brand-copy span {
        font-size: 12px;
      }

      .login-card {
        padding: 22px 18px 18px;
      }

      .mode-tab {
        font-size: 11px;
        padding-left: 6px;
        padding-right: 6px;
      }

      .inline-row {
        grid-template-columns: 1fr 78px;
      }

      .alt-login {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="index.html" aria-label="返回首页">
      <span class="brand-mark">
        <img src="images/gq_icon2.png" alt="光合组织">
      </span>
      <span class="brand-copy">
        <strong>HIECO 光合组织</strong>
        <span>光合技术支持平台</span>
      </span>
    </a>

    <section class="scene">
      <div class="hero" aria-hidden="true">
        <div class="floating-balls">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="orbit-core">
          <div class="robot-ring"></div>
          <div class="robot"></div>
        </div>
      </div>

      <div class="card-wrap">
        <section class="login-card">
          <h1>欢迎登录</h1>
          <p class="subtitle">请登录您的账号</p>

          <div class="mode-tabs" role="tablist" aria-label="登录方式切换">
            <button class="mode-tab active" type="button" data-mode="password" role="tab" aria-selected="true">账号密码</button>
            <button class="mode-tab" type="button" data-mode="sms" role="tab" aria-selected="false">短信验证码</button>
          </div>

          <div class="panel active" id="panel-password">
            <form id="password-form">
              <div class="field">
                <input id="account-input" type="text" value="15342824231" placeholder="请输入账号">
              </div>

              <div class="field">
                <input id="password-input" type="password" value="123456789012" placeholder="请输入密码">
                <button class="field-action" id="toggle-password" type="button" aria-label="显示或隐藏密码">👁</button>
              </div>

              <div class="inline-row">
                <div class="field" style="margin-bottom:0;">
                  <input id="captcha-input" type="text" placeholder="请输入验证码">
                </div>
                <button class="captcha-box" id="refresh-captcha" type="button" title="点击刷新验证码">
                  <canvas id="captcha-canvas" width="84" height="42"></canvas>
                </button>
              </div>

              <div class="actions">
                <label class="remember">
                  <input type="checkbox">
                  <span>记住密码</span>
                </label>
                <a class="forgot-link" href="auth.html">忘记密码</a>
              </div>

              <button class="primary-btn" type="submit">登录</button>
            </form>
          </div>

          <div class="panel" id="panel-sms">
            <form id="sms-form">
              <div class="field">
                <input id="sms-phone-input" type="tel" placeholder="请输入手机号">
              </div>

              <div class="inline-row" style="grid-template-columns: 1fr 104px;">
                <div class="field" style="margin-bottom:0;">
                  <input id="sms-code-input" type="text" placeholder="请输入短信验证码">
                </div>
                <button class="send-code-btn" id="send-sms-code" type="button">获取验证码</button>
              </div>

              <div class="inline-row">
                <div class="field" style="margin-bottom:0;">
                  <input id="sms-captcha-input" type="text" placeholder="请输入图形验证码">
                </div>
                <button class="captcha-box" id="refresh-captcha-sms" type="button" title="点击刷新验证码">
                  <canvas id="captcha-canvas-sms" width="84" height="42"></canvas>
                </button>
              </div>

              <div class="actions">
                <label class="remember">
                  <input type="checkbox">
                  <span>记住手机号</span>
                </label>
                <a class="forgot-link" href="auth.html">收不到验证码？</a>
              </div>

              <button class="primary-btn" type="submit">登录</button>
            </form>
          </div>

          <div class="panel qr-panel" id="panel-qr">
            <div class="qr-card">
              <div class="qr-head">
                <img src="images/gq_icon.png" alt="光圈" style="width:20px;height:20px;">
                <span>光圈扫码登录</span>
              </div>
              <div class="qr-canvas-wrap">
                <canvas id="qr-canvas" width="150" height="150"></canvas>
              </div>
              <p>请打开光圈 App，使用“扫一扫”完成登录。</p>
              <p>当前二维码为原型模拟码，用于展示扫码登录入口。</p>
              <div class="qr-status">二维码 2 分钟内有效</div>
              <button class="switch-back" id="back-to-password" type="button">返回账号密码登录</button>
            </div>
          </div>

          <div class="signup-bar">
            <span>没有账号？</span>
            <a class="register-link" href="register.html">去注册</a>
          </div>

          <div class="divider">其他方式登录</div>

          <div class="alt-login">
            <button id="guangquan-login" type="button">
              <img src="images/gq_icon.png" alt="光圈">
              <span>光圈</span>
            </button>
            <a href="https://www.hieco.com.cn/login" id="official-login">
              <span>官网</span>
            </a>
          </div>
        </section>
      </div>
    </section>

    <div class="right-balls" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="wave-group" aria-hidden="true">
      <div class="wave-glow"></div>
      <div class="wave wave-1"></div>
      <div class="wave wave-2"></div>
      <div class="wave wave-3"></div>
    </div>
  </main>

  <script>
    const modeTabs = document.querySelectorAll(".mode-tab");
    const panels = {
      password: document.getElementById("panel-password"),
      sms: document.getElementById("panel-sms"),
      qr: document.getElementById("panel-qr")
    };

    function setActiveMode(mode) {
      Object.values(panels).forEach(panel => panel.classList.remove("active"));
      panels[mode].classList.add("active");

      modeTabs.forEach(tab => {
        const isActive = tab.dataset.mode === mode;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-selected", String(isActive));
      });
    }

    modeTabs.forEach(tab => {
      tab.addEventListener("click", () => setActiveMode(tab.dataset.mode));
    });

    document.getElementById("guangquan-login").addEventListener("click", () => {
      setActiveMode("qr");
    });

    document.getElementById("back-to-password").addEventListener("click", () => {
      setActiveMode("password");
    });

    const passwordInput = document.getElementById("password-input");
    document.getElementById("toggle-password").addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
    });

    function randomCaptcha(length) {
      const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
      let result = "";
      for (let i = 0; i < length; i += 1) {
        result += chars[Math.floor(Math.random() * chars.length)];
      }
      return result;
    }

    function drawCaptcha(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      const code = randomCaptcha(4);

      canvas.dataset.code = code;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f8f2ef";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 8; i += 1) {
        ctx.strokeStyle = `rgba(${120 + i * 12}, ${90 + i * 8}, ${90 + i * 5}, 0.25)`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
      }

      for (let i = 0; i < code.length; i += 1) {
        ctx.save();
        ctx.font = `${24 + Math.floor(Math.random() * 3)}px Georgia`;
        ctx.fillStyle = ["#5d5d5d", "#787878", "#3b6f5c", "#874c4c"][i % 4];
        ctx.translate(12 + i * 18, 28 + Math.random() * 6);
        ctx.rotate(((Math.random() - 0.5) * Math.PI) / 5);
        ctx.fillText(code[i], 0, 0);
        ctx.restore();
      }

      for (let i = 0; i < 16; i += 1) {
        ctx.fillStyle = "rgba(110, 110, 110, 0.18)";
        ctx.beginPath();
        ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawFakeQr() {
      const canvas = document.getElementById("qr-canvas");
      const ctx = canvas.getContext("2d");
      const size = 10;
      const count = canvas.width / size;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      function drawFinder(x, y) {
        ctx.fillStyle = "#111";
        ctx.fillRect(x, y, size * 3, size * 3);
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + size * 0.5, y + size * 0.5, size * 2, size * 2);
        ctx.fillStyle = "#111";
        ctx.fillRect(x + size, y + size, size, size);
      }

      drawFinder(0, 0);
      drawFinder(canvas.width - size * 3, 0);
      drawFinder(0, canvas.height - size * 3);

      for (let row = 0; row < count; row += 1) {
        for (let col = 0; col < count; col += 1) {
          const inFinder =
            (row < 3 && col < 3) ||
            (row < 3 && col > count - 4) ||
            (row > count - 4 && col < 3);

          if (inFinder) {
            continue;
          }

          const seed = (row * 17 + col * 13 + row * col) % 7;
          if (seed === 0 || seed === 2 || (row + col) % 5 === 0) {
            ctx.fillStyle = "#111";
            ctx.fillRect(col * size, row * size, size, size);
          }
        }
      }

      ctx.fillStyle = "#d60d14";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText("GQ", canvas.width / 2, canvas.height / 2 + 4);
    }

    drawCaptcha("captcha-canvas");
    drawCaptcha("captcha-canvas-sms");
    drawFakeQr();

    document.getElementById("refresh-captcha").addEventListener("click", () => drawCaptcha("captcha-canvas"));
    document.getElementById("refresh-captcha-sms").addEventListener("click", () => drawCaptcha("captcha-canvas-sms"));

    function startCountdown(button, seconds) {
      let remaining = seconds;
      button.disabled = true;
      button.textContent = `${remaining}s`;

      const timer = window.setInterval(() => {
        remaining -= 1;
        button.textContent = `${remaining}s`;
        if (remaining <= 0) {
          window.clearInterval(timer);
          button.disabled = false;
          button.textContent = "获取验证码";
        }
      }, 1000);
    }

    document.getElementById("send-sms-code").addEventListener("click", event => {
      const phone = document.getElementById("sms-phone-input").value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        window.alert("请输入正确的手机号");
        return;
      }
      startCountdown(event.currentTarget, 60);
      window.alert("短信验证码已发送到您的手机，当前为原型演示。");
    });

    document.getElementById("password-form").addEventListener("submit", event => {
      event.preventDefault();
      const account = document.getElementById("account-input").value.trim();
      const password = document.getElementById("password-input").value.trim();
      const captcha = document.getElementById("captcha-input").value.trim().toUpperCase();
      const currentCode = document.getElementById("captcha-canvas").dataset.code;

      if (!account || !password || !captcha) {
        window.alert("请完整填写登录信息");
        return;
      }

      if (captcha !== currentCode) {
        window.alert("图形验证码不正确，请重新输入");
        drawCaptcha("captcha-canvas");
        return;
      }

      window.alert("登录成功，当前为原型演示。");
    });

    document.getElementById("sms-form").addEventListener("submit", event => {
      event.preventDefault();
      const phone = document.getElementById("sms-phone-input").value.trim();
      const smsCode = document.getElementById("sms-code-input").value.trim();
      const captcha = document.getElementById("sms-captcha-input").value.trim().toUpperCase();
      const currentCode = document.getElementById("captcha-canvas-sms").dataset.code;

      if (!/^1[3-9]\d{9}$/.test(phone)) {
        window.alert("请输入正确的手机号");
        return;
      }

      if (!smsCode) {
        window.alert("请输入短信验证码");
        return;
      }

      if (captcha !== currentCode) {
        window.alert("图形验证码不正确，请重新输入");
        drawCaptcha("captcha-canvas-sms");
        return;
      }

      window.alert("短信验证码登录成功，当前为原型演示。");
    });
  </script>
</body>
</html>
